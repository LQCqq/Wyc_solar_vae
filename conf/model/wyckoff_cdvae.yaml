# 模型结构
latent_dim: 512
hidden_dim: 512
max_wyckoff_sites: 12   # 每个晶体最多预测的wyckoff位点数
fc_num_layers: 3

# per-site latent双路径监督
site_z_encoder_loss_weight: 0.3
site_z_projector_loss_weight: 0.7

# conditional per-site prior
site_prior_kl_scale: 0.1
site_prior_logvar_min: -10.0
site_prior_logvar_max: 2.0

# Ehull 条件生成（第一阶段：condition，不增加 Ehull loss）
use_stability_condition: true
num_stability_classes: 4
cfg_p_uncond: 0.15


# 损失权重
beta: 0.01           # KL 权重，对应原版 hparams.beta
cost_property: 1.0   # 属性损失权重

# Wyckoff 各子损失权重
w_spg: 1.0
w_lattice: 1.0
w_elem: 1.0
w_letter: 1.0
w_free: 1.0
w_overlap: 1.0
w_charge: 0.0

# 数据
use_wyckoff: true
predict_property: false

# 保留原始 CDVAE 中 BaseModule 需要的字段
# （从 vae.yaml 继承，避免 hparams 缺失）
max_atoms: ${data.max_atoms}
teacher_forcing_max_epoch: ${data.teacher_forcing_max_epoch}
